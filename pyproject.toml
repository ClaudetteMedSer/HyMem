[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hymem"
version = "0.1.0"
description = "Hybrid memory module for the Hermes agent: SQLite knowledge graph + delimited Markdown sections + dreaming consolidation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev    = ["pytest>=8"]
server = ["mcp>=1.0,<2", "openai>=1.0", "fastapi>=0.115", "uvicorn>=0.30", "sqlite-vec>=0.1.0"]
# Compatible range rather than an exact pin; the contract test asserts the SDK
# surface HyMem actually uses, so a patch/minor bump is caught if it drifts.
honcho = ["honcho-ai>=2.1,<3"]
# Local cross-encoder reranker (config rerank_model="cross-encoder"). Optional:
# without it, reranking falls back to the LLM path.
rerank = ["sentence-transformers>=2.2"]

[project.scripts]
hymem-server = "hymem.server:main"
hymem-honcho = "hymem.honcho.app:main"
hymem-doctor = "hymem.doctor:main"

[tool.setuptools.packages.find]
include = ["hymem*"]

[tool.setuptools.package-data]
# Ship schema.sql and the migration scripts inside the wheel so
# importlib.resources.files() can read them on a pip-installed copy.
"hymem.core" = ["schema.sql"]
"hymem.core.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
